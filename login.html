<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | JEONG MOTORS</title>
<meta name="description" content="JEONG 공식 사이트 — 자동차 부품, 프로젝트, 연구">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="wrap">
    <button class="icon-btn menu-btn" aria-label="메뉴 열기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="logo" href="index.html">JEONG</a>
    <div class="actions">
      <select class="lang" aria-label="언어 선택">
        <option value="ko">KO</option>
        <option value="en">EN</option>
      </select>
      <button type="button" class="icon-btn profile-btn" aria-label="프로필" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      </button>
    </div>
  </div>
</header>

<dialog id="drawer" aria-label="메뉴">
  <button class="icon-btn close" aria-label="닫기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <nav>
    <a href="index.html" data-en="Home">홈</a>
    <span class="soon" aria-disabled="true"><span data-en="Parts Store">부품 스토어</span> <small data-en="Soon">준비중</small></span>
    <span class="soon" aria-disabled="true"><span data-en="Projects">프로젝트</span> <small data-en="Soon">준비중</small></span>
    <a href="research/index.html" data-en="Research">논문</a>
    <span class="soon" aria-disabled="true"><span data-en="Contact">문의</span> <small data-en="Soon">준비중</small></span>
  </nav>
</dialog>

<main class="wrap login">
  <div class="login-box">
    <h1 data-en="Sign in">로그인</h1>
    <p class="sub">개발용 임시 로그인 — 아무 값이나 입력하면 됩니다.</p>
    <form id="login-form">
      <label>아이디 또는 이메일<input name="id" autocomplete="username" autofocus></label>
      <label>비밀번호<input name="pw" type="password" autocomplete="current-password"></label>
      <button class="pop-btn primary" type="submit" data-en="Sign in">로그인</button>
    </form>
  </div>
</main>

<footer><div class="wrap">© 2026 JEONG MOTORS. All rights reserved.</div></footer>
<script src="js/main.js"></script>
<script>
  // 로그인 후 원래 보던 페이지로. 같은 사이트 주소만 허용 (외부로 튕기는 open redirect 방지)
  function nextUrl() {
    const raw = new URLSearchParams(location.search).get('next');
    try {
      const u = new URL(raw, location.href);
      if (raw && u.origin === location.origin && /^(https?|file):$/.test(u.protocol) && !u.pathname.endsWith('/login.html')) return u.href;
    } catch {}
    return new URL('index.html', location.href).href;
  }
  document.getElementById('login-form').addEventListener('submit', e => {
    e.preventDefault();
    auth.login(e.target.id.value.trim() || 'Guest'); // ponytail: 비밀번호 검사 없음
    location.replace(nextUrl()); // replace: 뒤로가기로 로그인 화면에 다시 안 옴
  });
</script>
</body>
</html>
