<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="JEONG MOTORS project">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../research/research.css">
<link rel="stylesheet" href="projects.css">
<link rel="stylesheet" href="../css/model-viewer.css">
<!-- Three.js (3D 뷰어용) — 버전 고정. js/model-viewer.js 가 사용 -->
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head>
<body>
<header>
  <div class="wrap">
    <button class="icon-btn menu-btn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="logo" href="../index.html">JEONG</a>
    <div class="actions">
      <button type="button" class="icon-btn profile-btn" aria-label="Profile" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      </button>
    </div>
  </div>
</header>

<dialog id="drawer" aria-label="Menu">
  <button class="icon-btn close" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <nav>
    <a href="../index.html">Home</a>
    <a href="../shop/index.html">Parts Store</a>
    <a href="index.html">Projects</a>
    <a href="../research/index.html">Research</a>
    <a href="../membership/index.html">Membership</a>
    <span class="soon" aria-disabled="true"><span>Contact</span> <small>Soon</small></span>
  </nav>
</dialog>

<!-- 3D 뷰어: 프로젝트에 model 이 등록돼 있으면 들어오자마자 보임 (viewer.js → ../js/model-viewer.js).
     화면에는 모델과 작은 프로젝트 이름·조작 안내만. 끌어서 돌려 볼 수 있고, 설명은 아래로 내리면 나옴.
     model 이 없는 프로젝트는 이 영역이 숨겨진 채로 기존 화면 그대로 -->
<section class="mv-viewer" id="viewer" aria-label="3D model viewer" hidden>
  <p class="mv-bg" aria-hidden="true"></p> <!-- viewer.js 가 채우는 요소. 상세 페이지에서는 CSS 로 숨김 -->
  <!-- 쇼룸 정보 레이어: detail.js 가 projects.js 데이터로 채움. 가장자리에만 배치, 가운데 모델은 그대로 끌 수 있음 -->
  <div class="pj-show" id="showroom"></div>
  <div class="mv-status" data-mv-status role="status"><p>LOADING 3D MODEL...</p></div>
</section>

<main class="wrap projects pj-detail" id="details">
  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    All projects
  </a>
  <div id="project"></div>
  <p class="pj-motto">DRIVING IS <span>JOY.</span></p>
</main>

<dialog id="lightbox" aria-label="Image viewer">
  <figure>
    <img src="" alt="">
    <span class="pj-kind"></span>
    <figcaption></figcaption>
    <button type="button" class="icon-btn close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </figure>
</dialog>

<footer><div class="wrap">© 2026 JEONG MOTORS. All rights reserved.</div></footer>
<script src="../js/i18n.js"></script>
<script src="../js/main.js"></script>
<script src="../research/documents.js"></script>
<script src="projects.js"></script>
<script src="detail.js"></script>
<script type="module" src="viewer.js"></script>
</body>
</html>
