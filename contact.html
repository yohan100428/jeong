<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의 | JEONG</title>
<meta name="description" content="JEONG 공식 사이트 — 자동차 부품, 프로젝트, 연구">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="index.html">JEONG</a>
  <button class="menu-btn" aria-label="메뉴">☰</button>
  <nav>
    <a href="index.html">홈</a>
    <a href="parts.html">부품</a>
    <a href="projects.html">프로젝트</a>
    <a href="research.html">연구</a>
    <a href="contact.html">문의</a>
  </nav>
</div></header>
<main>
<section><div class="wrap">
  <h2>문의</h2>
  <!-- action 주소: Formspree 등 폼 서비스 가입 후 교체 -->
  <form action="https://formspree.io/f/YOUR_ID" method="POST">
    <input name="name" placeholder="이름" required>
    <input name="email" type="email" placeholder="이메일" required>
    <select name="type">
      <option>부품 구매</option>
      <option>프로젝트 협업</option>
      <option>기타</option>
    </select>
    <input name="item" placeholder="품번 (부품 문의 시)">
    <textarea name="message" rows="6" placeholder="내용" required></textarea>
    <button class="btn" type="submit">보내기</button>
  </form>
</div></section>
<script>
  // parts.html 에서 넘어온 품번 자동 입력
  const item = new URLSearchParams(location.search).get('item');
  if (item) document.querySelector('[name=item]').value = item;
</script>
</main>
<footer><div class="wrap">© 2026 JEONG. All rights reserved.</div></footer>
<script src="js/main.js"></script>
</body>
</html>
