<main class="wrap research admin-page">
  <nav class="admin-tabs" aria-label="Admin menu"><a href="index.html">Dashboard</a><a href="research.html">Research</a><a href="upload.html" aria-current="page">Upload</a><a href="products.html">Products</a><a href="product.html">Add Product</a><a href="content.html">Content</a></nav>
  <h1 class="page-title">Upload Research</h1>
  <p class="sub">Register a new research document</p>

  <p id="gate" class="empty">Available in admin mode only.</p>

  <div id="panel" hidden>
  <form id="upload-form" class="upload">
      <fieldset>
        <legend>Basics</legend>
        <label class="full">Title *<input name="title" required></label>
        <label class="full">English title<input name="titleEn"></label>
        <label>Field *<input name="category" required placeholder="e.g. Aerodynamics"></label>
        <label>Document type *<input name="documentType" list="doc-types" required placeholder="Technical Report"></label>
        <datalist id="doc-types"><option>Technical Report</option><option>Test Report</option><option>Technical Review</option><option>Research Paper</option><option>Analysis</option></datalist>
        <label>Author *<input name="author" required value="JEONG MOTORS" placeholder="comma separated"></label>
        <label>Date *<input name="createdAt" type="date" required></label>
        <label>Slug (URL) *<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="k01-steering-geometry" title="lowercase letters, numbers, hyphens"></label>
        <label>Version<input name="version" placeholder="1.0"></label>
        <label>Related project<input name="projectId" placeholder="K-01"></label>
        <label>Visibility
          <select name="status"><option value="draft">Draft (hidden)</option><option value="published">Published</option></select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Content</legend>
        <label class="full">Keywords<input name="keywords" placeholder="comma separated: CFD, Aerodynamics"></label>
        <label class="full">Abstract<textarea name="abstract" rows="4"></textarea></label>
              <label class="full">Attachments<input name="attachments" type="file" multiple accept=".pdf,.step,.stp,.stl,.csv,.xlsx,.zip,.png,.jpg,.jpeg"></label>
        <p id="existing" class="hint full"></p>
      </fieldset>

      <button type="submit" class="pop-btn primary">Upload</button>
    </form>
  </div>

  <div id="result" class="notice" role="status" hidden><strong></strong><span></span><pre></pre></div>
</main>
