<head>

<meta name="robots" content="noindex">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../research/research.css">

<body data-page="dashboard">
<header>
  <div class="wrap">
    <button class="icon-btn menu-btn" aria-label="메뉴 열기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="logo" href="../index.html">JEONG</a>
    <div class="actions">
      <select class="lang" aria-label="언어 선택">
        <option value="ko">KO</option>
        <option value="en">EN</option>
      </select>
      <button type="button" class="icon-btn profile-btn" aria-label="프로필" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      </button>
    </div>
  </div>
</header>

<dialog id="drawer" aria-label="메뉴">
  <button class="icon-btn close" aria-label="닫기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <nav>
    <a href="../index.html" data-en="Home">홈</a>
    <a href="../shop/index.html" data-en="Parts Store">부품 스토어</a>
    <span class="soon" aria-disabled="true"><span data-en="Projects">프로젝트</span> <small data-en="Soon">준비중</small></span>
    <a href="../research/index.html" data-en="Research">논문</a>
    <span class="soon" aria-disabled="true"><span data-en="Contact">문의</span> <small data-en="Soon">준비중</small></span>
  </nav>
</dialog>

<main class="wrap research admin-page">
  <nav class="admin-tabs" aria-label="관리자 메뉴"><a href="index.html" aria-current="page">Dashboard</a><a href="research.html">Research</a><a href="upload.html">Upload</a><a href="content.html">Content</a></nav>
  <h1 class="page-title">Admin Dashboard</h1>
  <p class="sub">연구자료 현황</p>

  <p id="gate" class="empty">관리자 모드에서만 사용할 수 있습니다.</p>

  <div id="panel" hidden>
    <div id="stats" class="stats"></div>
    <div class="cols">
      <section><h2>분야별</h2><ul id="cats" class="rows"></ul></section>
      <section><h2>최근 자료</h2><ul id="recent" class="rows"></ul></section>
    </div>
    <div class="quick">
      <a class="pop-btn primary" href="upload.html">+ 새 자료 업로드</a>
      <a class="pop-btn" href="research.html">자료 관리</a>
      <a class="pop-btn" href="content.html">콘텐츠 관리</a>
    </div>
  </div>

  <div id="result" class="notice" role="status" hidden><strong></strong><span></span><pre></pre></div>
</main>

<footer><div class="wrap">© 2026 JEONG MOTORS. All rights reserved.</div></footer>
