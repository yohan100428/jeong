<body data-page="product">
<header>
  <div class="wrap">
    <button class="icon-btn menu-btn" aria-label="메뉴 열기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="logo" href="../index.html">JEONG</a>
    <div class="actions">
      <select class="lang" aria-label="언어 선택">
        <option value="ko">KO</option>
        <option value="en">EN</option>
      </select>
      <button type="button" class="icon-btn profile-btn" aria-label="프로필" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      </button>
    </div>
  </div>
</header>

<dialog id="drawer" aria-label="메뉴">
  <button class="icon-btn close" aria-label="닫기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <nav>
    <a href="../index.html" data-en="Home">홈</a>
    <a href="../shop/index.html" data-en="Parts Store">부품 스토어</a>

    <span class="soon" aria-disabled="true"><span data-en="Contact">문의</span> <small data-en="Soon">준비중</small></span>
  </nav>
</dialog>

<main class="wrap research admin-page">
  <nav class="admin-tabs" aria-label="관리자 메뉴"><a href="index.html">Dashboard</a><a href="research.html">Research</a><a href="upload.html">Upload</a><a href="products.html">Products</a><a href="product.html" aria-current="page">Add Product</a><a href="content.html">Content</a></nav>
  <h1 class="page-title">Add Product</h1>
  <p class="sub">새 상품 등록</p>

  <p id="gate" class="empty">관리자 모드에서만 사용할 수 있습니다.</p>

  <div id="panel" hidden>
    <form id="product-form" class="upload">
      <fieldset>
        <legend>기본 정보</legend>
        <label class="full">상품명 *<input name="name" required></label>
        <label class="full">한 줄 소개 *<input name="summary" required></label>
        <label>slug (주소) *<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="rack-pinion-gearbox" title="영문 소문자, 숫자, 하이픈"></label>
        <label>카테고리 *<input name="category" required placeholder="예: Steering"></label>
        <label>가격<input name="price" type="number" min="0" step="any" placeholder="비우면 '가격 미정'"></label>
        <label>통화
          <select name="currency"><option>KRW</option><option>USD</option><option>EUR</option><option>JPY</option></select>
        </label>
        <label>판매 상태
          <select name="availability"><option value="coming-soon">Coming Soon</option><option value="available">판매중</option><option value="sold-out">품절</option></select>
        </label>
        <label>검토 상태
          <select name="status"><option value="review">Under Review (미검증)</option><option value="tested">Tested (직접 시험)</option><option value="used">Used in Project (실제 장착)</option></select>
        </label>
        <p class="hint full">Tested / Used in Project 는 직접 사용·시험한 경우에만 선택. 아래 "검증 내용"이 필수입니다.</p>
      </fieldset>

      <fieldset>
        <legend>이미지 · 영상</legend>
        <label class="full">상품 이미지 (첫 장이 대표)<input name="images" type="file" multiple accept="image/*"></label>
        <label class="full">실제 사용 사진<input name="actionImages" type="file" multiple accept="image/*"></label>
        <p id="existing" class="hint full"></p>
        <label class="full">YouTube 영상 주소<input name="video" type="url" placeholder="https://www.youtube.com/watch?v=..."></label>
      </fieldset>

      <fieldset>
        <legend>특징 · JEONG Review</legend>
        <label class="full">핵심 특징 (한 줄에 하나)<textarea name="features" rows="3"></textarea></label>
        <label>장점 (한 줄에 하나)<textarea name="pros" rows="3"></textarea></label>
        <label>단점 (한 줄에 하나)<textarea name="cons" rows="3"></textarea></label>
        <label class="full">선정 이유<textarea name="reason" rows="2"></textarea></label>
        <label class="full">검증 내용 (어디서 어떻게 써봤는지)<textarea name="verification" rows="2"></textarea></label>
      </fieldset>

      <fieldset>
        <legend>기술 사양</legend>
        <div id="specs" class="full"></div>
        <button type="button" id="add-spec" class="pop-btn add-spec">+ 사양 추가</button>
      </fieldset>

      <fieldset>
        <legend>호환성 · 관련 콘텐츠</legend>
        <label class="full">호환성 · 장착 조건 (한 줄에 하나)<textarea name="compatibility" rows="3"></textarea></label>
        <label class="full">주의 · 미검증 사항 (한 줄에 하나)<textarea name="notes" rows="3"></textarea></label>
        <label>관련 프로젝트<input name="projectId" placeholder="K-01"></label>
        <label>관련 기술 보고서 slug<input name="relatedResearch" placeholder="쉼표로 구분"></label>
        <label class="full">관련 상품 slug<input name="relatedProducts" placeholder="쉼표로 구분"></label>
      </fieldset>

      <button type="submit" class="pop-btn primary">등록</button>
    </form>
    <template id="spec-row">
      <div class="spec-row">
        <input class="label" placeholder="항목 (예: 중량)" aria-label="사양 항목">
        <input class="value" placeholder="값 (예: 1.2 kg)" aria-label="사양 값">
        <select class="source" aria-label="출처"><option value="manufacturer">제조사</option><option value="measured">JEONG 실측</option></select>
        <button type="button" class="rm" aria-label="사양 행 삭제">×</button>
      </div>
    </template>
  </div>

  <div id="result" class="notice" role="status" hidden><strong></strong><span></span><pre></pre></div>
</main>
